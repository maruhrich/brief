<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Defence Brief</title>
  <meta name="description" content="Brief quotidien défense et géopolitique : Asie-Pacifique et défense aérienne">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Brief">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0f14" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css?v=17">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="top-row">
        <button id="back" class="icon-btn" type="button" aria-label="Retour au brief" data-i18n-label="back" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <p class="kicker" data-i18n="kicker">Défense &amp; Géopo</p>
        <div class="top-actions">
          <button id="btn-lang" class="lang-btn" type="button" aria-label="Switch to English" data-i18n-label="langSwitch">F</button>
          <button id="btn-search" class="icon-btn" type="button" aria-label="Rechercher" data-i18n-label="search">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button id="btn-favs" class="icon-btn" type="button" aria-label="Favoris" data-i18n-label="favs">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </button>
          <button id="refresh" class="icon-btn" type="button" aria-label="Actualiser" data-i18n-label="refresh">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <h1 id="title">Brief du jour</h1>
    </div>
  </header>

  <main class="wrap">
    <div id="view-brief">
      <div id="banner" class="banner" hidden></div>
      <div id="hebdo" hidden></div>
      <div id="accroche" class="accroche"></div>
      <section id="essentiel" class="essentiel" hidden></section>
      <div id="pile-head" class="pile-head" hidden></div>
      <select id="place" class="place" aria-label="Filtrer par région ou pays" data-i18n-label="placeAria" hidden></select>
      <nav id="chips" class="chips" aria-label="Rubriques" data-i18n-label="sections" hidden></nav>
      <div id="rubriques"></div>
      <button id="show-read" class="link-btn" type="button" hidden></button>
      <section id="watch" class="watch" hidden></section>
      <section class="panel archive">
        <label for="archive-select" data-i18n="prevBriefs">Briefs précédents</label>
        <select id="archive-select"></select>
      </section>
      <button id="hebdo-link" class="link-btn" type="button" hidden></button>
      <section class="panel notif">
        <h2>Notifications</h2>
        <p id="notif-status">Chargement…</p>
        <textarea id="notif-code" rows="4" readonly hidden></textarea>
        <button id="notif-btn" class="primary-btn" type="button" hidden></button>
      </section>
      <section class="panel notif">
        <h2 data-i18n="askAI">Demander à l’IA</h2>
        <p id="ai-status"></p>
        <button id="ai-key-btn" class="primary-btn" type="button"></button>
      </section>
      <footer id="meta" class="meta"></footer>
    </div>

    <div id="view-search" hidden>
      <input id="q" class="search-input" type="search" placeholder="Patriot, Taïwan, Thales…" data-i18n-ph="searchPh" autocomplete="off" enterkeyhint="search">
      <div id="search-results"></div>
    </div>

    <div id="view-favs" hidden>
      <h2 class="view-title" data-i18n="favs">Favoris</h2>
      <div id="favs-list"></div>
    </div>
  </main>

  <div id="ask" class="sheet" role="dialog" aria-modal="true" aria-labelledby="ask-title" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <p class="kicker" data-i18n="askAI">Demander à l’IA</p>
        <button class="icon-btn" type="button" data-close aria-label="Fermer" data-i18n-label="close">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <h2 id="ask-title" class="sheet-title"></h2>
      <div id="ask-body" class="ask-body"></div>
      <form id="ask-form" class="ask-form">
        <input id="ask-input" type="text" placeholder="Pose une question sur ce sujet…" data-i18n-ph="askPh" autocomplete="off" enterkeyhint="send">
        <button type="submit" class="primary-btn" data-i18n="askSend">Envoyer</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <div id="install-tip" class="install-tip" hidden>
    <p data-i18n-html="installTip">Pour l’ajouter à l’écran d’accueil : touche <strong>Partager</strong>, puis <strong>« Sur l’écran d’accueil »</strong>.</p>
    <button type="button" id="install-close" aria-label="Fermer" data-i18n-label="close">✕</button>
  </div>

  <script src="app.js?v=17"></script>
</body>
</html>
