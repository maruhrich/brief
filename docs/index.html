<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Defence Brief</title>
  <meta name="description" content="Daily defence and geopolitics brief: Asia-Pacific and air defence">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Brief">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0f14" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="top-row">
        <button id="back" class="icon-btn" type="button" aria-label="Back to the brief" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <p class="kicker">Defence &amp; Geopolitics</p>
        <div class="top-actions">
          <button id="btn-search" class="icon-btn" type="button" aria-label="Search">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button id="btn-favs" class="icon-btn" type="button" aria-label="Favourites">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </button>
          <button id="refresh" class="icon-btn" type="button" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <h1 id="title">Today’s brief</h1>
      <p class="updated" id="updated">Loading…</p>
    </div>
  </header>

  <main class="wrap">
    <div id="view-brief">
      <div id="banner" class="banner" hidden></div>
      <div id="hebdo" hidden></div>
      <p id="accroche" class="accroche"></p>
      <section id="essentiel" class="essentiel" hidden></section>
      <div id="pile-head" class="pile-head" hidden></div>
      <div id="filters" class="filters" hidden>
        <nav id="chips" class="chips" aria-label="Sections"></nav>
        <select id="place" class="place" aria-label="Filter by region or country"></select>
      </div>
      <div id="rubriques"></div>
      <button id="show-read" class="link-btn" type="button" hidden></button>
      <section id="watch" class="watch" hidden></section>
      <section class="panel archive">
        <label for="archive-select">Previous briefs</label>
        <select id="archive-select"></select>
      </section>
      <button id="hebdo-link" class="link-btn" type="button" hidden></button>
      <section class="panel notif">
        <h2>Notifications</h2>
        <p id="notif-status">Loading…</p>
        <textarea id="notif-code" rows="4" readonly hidden></textarea>
        <button id="notif-btn" class="primary-btn" type="button" hidden></button>
      </section>
      <section class="panel notif">
        <h2>Ask AI</h2>
        <p id="ai-status"></p>
        <button id="ai-key-btn" class="primary-btn" type="button"></button>
      </section>
      <footer id="meta" class="meta"></footer>
    </div>

    <div id="view-search" hidden>
      <input id="q" class="search-input" type="search" placeholder="Patriot, Taiwan, Thales…" autocomplete="off" enterkeyhint="search">
      <div id="search-results"></div>
    </div>

    <div id="view-favs" hidden>
      <h2 class="view-title">Favourites</h2>
      <div id="favs-list"></div>
    </div>
  </main>

  <div id="ask" class="sheet" role="dialog" aria-modal="true" aria-labelledby="ask-title" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <p class="kicker">Ask AI</p>
        <button class="icon-btn" type="button" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <h2 id="ask-title" class="sheet-title"></h2>
      <div id="ask-body" class="ask-body"></div>
      <form id="ask-form" class="ask-form">
        <input id="ask-input" type="text" placeholder="Ask about this story…" autocomplete="off" enterkeyhint="send">
        <button type="submit" class="primary-btn">Ask</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <div id="install-tip" class="install-tip" hidden>
    <p>To add it to your home screen: tap <strong>Share</strong>, then <strong>“Add to Home Screen”</strong>.</p>
    <button type="button" id="install-close" aria-label="Close">✕</button>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
