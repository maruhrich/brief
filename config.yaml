# ─────────────────────────────────────────────────────────────
#  Réglages du brief quotidien
#  Modifie ce fichier pour changer les sujets, les sources, l'heure…
# ─────────────────────────────────────────────────────────────

# Pour qui le brief est écrit (l'IA adapte le tri et le « pourquoi c'est important »)
profil: >
  European defence industry professional based in Singapore, specialised in air defence
  (IAMD, surface-to-air, C2, radars, counter-drone). Wants to stay well informed on geopolitics
  and defence in Asia-Pacific, and on major world events (elections, conflicts, diplomacy).
langue: British English
fuseau: Asia/Singapore
heures: 24              # on garde les articles publiés dans les dernières X heures
max_par_flux: 25        # nombre max d'articles lus par flux RSS
max_par_recherche: 15   # nombre max d'articles lus par recherche Google News
max_articles_ia: 650    # plafond total envoyé à l'IA
# Médias ignorés (souvent remontés par Google News, peu fiables ou hors sujet)
sources_exclues: [Facebook, YouTube, Instagram, TikTok, X, World Socialist Web Site, Vietnam.vn, Sputnik, RT]
synthese_hebdo: lundi   # jour de la synthèse de la semaine (ou « non »)
sujets_par_jour: 15     # nouveaux sujets ajoutés chaque jour à la pile « À lire » (hors essentiel)
pile_jours: 7           # un sujet non lu reste dans la pile pendant X jours
memoire_jours: 3        # l'IA évite de répéter les sujets des X derniers jours

# Modèle IA (Google Gemini, offre gratuite). Les suivants servent de secours.
modeles:
  - gemini-flash-latest
  - gemini-3.6-flash
  - gemini-3.5-flash-lite

# ── Rubriques du brief (dans l'ordre d'affichage) ───────────
# max       : nombre maximum de sujets dans la rubrique
# consigne  : ce que l'IA doit y mettre
# mots_cles : utilisés seulement si l'IA est indisponible (classement simple)
rubriques:
  - id: monde
    titre: World
    max: 2
    consigne: >
      Major international news not covered by another section: the Americas, Africa, global diplomacy, international organisations.
    mots_cles: []

  - id: asie
    titre: APAC
    max: 6
    consigne: >
      Everything Asia-Pacific: security, geopolitics, politics and economy of China, Taiwan, the Koreas, Japan, Singapore (SAF, RSAF, MINDEF), South-East Asia and ASEAN (Indonesia, Malaysia, the Philippines, Vietnam, Thailand, Myanmar), India, Pakistan, Australia and the Pacific. Singapore news is a priority.
    mots_cles: [singapore, singapour, mindef, rsaf, asean, malaysia, indonesia, philippines, vietnam, thailand, myanmar, cambodia, malaisie, indonésie, thaïlande, china, taiwan, korea, japan, india, pakistan, australia, south china sea, pla, chine, taïwan, corée, japon, inde, australie]

  - id: elections
    titre: Elections & Politics
    max: 3
    consigne: >
      Elections, changes of government and major political crises worldwide (Asia first), with dates and results when known.
    mots_cles: [election, élection, vote, ballot, referendum, référendum, législatives, présidentielle, prime minister, premier ministre, parliament, 선거, 選挙]

  - id: defense_aerienne
    titre: Air & Missile Defence
    max: 4
    consigne: >
      Air and missile defence (IAMD, surface-to-air, GBAD), radars, C2, counter-drone (C-UAS), combat aviation, missile and drone strikes and their interception, worldwide.
    mots_cles: [air defense, air defence, missile defense, interceptor, iamd, gbad, patriot, thaad, samp/t, c-uas, counter-drone, antimissile, défense aérienne, sol-air, 防空, 방공]

  - id: industrie
    titre: Defence Industry & Contracts
    max: 3
    consigne: >
      Defence contracts and programmes, defence budgets, exports, defence company news (Airbus, Thales, MBDA, Lockheed Martin, RTX, Hanwha, Rafael, Saab, KAI…), Asia first.
    mots_cles: [contract, contrat, procurement, acquisition, tender, budget, airbus, thales, mbda, lockheed, raytheon, rtx, hanwha, rafael, boeing, saab, defence industry, industrie]

  - id: ukraine
    titre: Ukraine / Russia
    max: 2
    consigne: >
      War in Ukraine and Russia: front line, missile and drone strikes, Ukrainian air defence, negotiations, related sanctions.
    mots_cles: [ukraine, russia, russie, kyiv, kiev, moscow, moscou, kremlin, zelensky, putin, poutine]

  - id: moyen_orient
    titre: Middle East
    max: 2
    consigne: >
      Iran, Israel, Gaza, Lebanon, Syria, the Gulf, Yemen / Houthis, Red Sea.
    mots_cles: [iran, israel, israël, gaza, lebanon, liban, syria, syrie, houthi, yemen, yémen, saudi, red sea]

  - id: europe
    titre: Europe
    max: 3
    consigne: >
      Europe: defence and security (NATO, European armed forces, budgets and programmes such as SAMP/T, ESSI, FCAS, GCAP, French defence policy) and major European political news.
    mots_cles: [nato, otan, european defence, defense européenne, bundeswehr, ministère des armées, essi]

  - id: espace
    titre: Space & Satellites
    max: 2
    consigne: >
      Military and dual-use space: Earth observation and communication satellites, early warning, launches, national space programmes, counter-space threats.
    mots_cles: [satellite, space force, launch, orbit, spatial, espace, rocket, fusée]

  - id: tech
    titre: Emerging Tech
    max: 2
    consigne: >
      Disruptive military technologies: hypersonics, military AI, drone swarms, directed-energy weapons (lasers, microwaves), quantum, autonomy.
    mots_cles: [hypersonic, hypersonique, laser, directed energy, drone swarm, essaim, artificial intelligence, quantum, quantique, autonomous]

  - id: economie
    titre: Economy & Sanctions
    max: 2
    consigne: >
      Export controls, sanctions, trade wars, strategic supply chains (semiconductors, rare earths, energy).
    mots_cles: [sanction, export control, tariff, droits de douane, semiconductor, semi-conducteur, rare earth, terres rares, supply chain]

