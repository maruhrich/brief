# ── Recherches Google News (dernières 24 h) ─────────────────
# langue : en, fr, ja (japonais), ko (coréen), zh-TW (Taïwan), id (indonésien)
recherches:
  - { q: '"air defense" OR "air defence" OR "missile defense" OR "missile defence" OR IAMD OR GBAD', langue: en, rubrique: defense_aerienne }
  - { q: '"counter-drone" OR "counter-UAS" OR "C-UAS" OR "drone interception"', langue: en, rubrique: defense_aerienne }
  - { q: '"surface-to-air missile" OR "ballistic missile" OR "hypersonic missile"', langue: en, rubrique: defense_aerienne }
  - { q: '"Taiwan Strait" OR "South China Sea" OR "North Korea" military', langue: en, rubrique: asie }
  - { q: 'RSAF OR MINDEF OR "Singapore Armed Forces"', langue: en, rubrique: singapour }
  - { q: 'ASEAN OR (Philippines OR Indonesia OR Malaysia OR Vietnam) military', langue: en, rubrique: singapour }
  - { q: 'defence contract (Indonesia OR Philippines OR Malaysia OR Thailand OR Vietnam OR India OR Japan OR "South Korea" OR Australia OR Singapore)', langue: en, rubrique: industrie }
  - { q: '"Airbus Defence and Space"', langue: en, rubrique: industrie }
  - { q: 'site:breakingdefense.com', langue: en, rubrique: industrie }
  - { q: '"military satellite" OR "Space Force" OR "early warning satellite" OR "anti-satellite"', langue: en, rubrique: espace }
  - { q: 'hypersonic OR "directed energy" OR "laser weapon" OR "drone swarm" OR "military AI"', langue: en, rubrique: tech }
  - { q: '"state-sponsored" cyberattack OR "electronic warfare" OR "GPS jamming"', langue: en, rubrique: cyber }
  - { q: 'NATO OR "European defence" OR "EU defence" OR "European Sky Shield"', langue: en, rubrique: europe }
  - { q: 'Ukraine "air defense" OR Russia missile strike', langue: en, rubrique: ukraine }
  - { q: 'Iran OR Israel OR Houthi military', langue: en, rubrique: moyen_orient }
  - { q: '"export controls" OR sanctions OR "rare earths" OR semiconductors China', langue: en, rubrique: economie }
  - { q: 'election (Japan OR "South Korea" OR Taiwan OR Philippines OR Indonesia OR Malaysia OR Thailand OR India OR Australia OR Singapore OR Myanmar)', langue: en, rubrique: elections }
  - { q: '"election results" OR "presidential election" OR "general election"', langue: en, rubrique: elections }
  - { q: 'site:reuters.com (military OR defence OR election OR geopolitics)', langue: en, rubrique: monde }
  - { q: '"défense aérienne" OR "défense sol-air" OR antimissile OR "Indo-Pacifique"', langue: fr, rubrique: defense_aerienne }
