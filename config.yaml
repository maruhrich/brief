# ─────────────────────────────────────────────────────────────
#  Réglages du brief quotidien
#  Modifie ce fichier pour changer les sujets, les sources, l'heure…
# ─────────────────────────────────────────────────────────────

# Pour qui le brief est écrit (l'IA adapte le tri et le « pourquoi c'est important »)
profil: >
  Professionnelle de l'industrie de défense européenne basée à Singapour,
  spécialisée en défense aérienne (IAMD, défense sol-air, C2, radars, lutte anti-drones).
  Veut être bien informée sur la géopolitique et la défense en Asie-Pacifique,
  ainsi que sur les grands événements mondiaux (élections, conflits, diplomatie).

langue: français
fuseau: Asia/Singapore
heures: 24              # on garde les articles publiés dans les dernières X heures
max_par_flux: 25        # nombre max d'articles lus par flux RSS
max_par_recherche: 15   # nombre max d'articles lus par recherche Google News
max_articles_ia: 650    # plafond total envoyé à l'IA
# Médias ignorés (souvent remontés par Google News, peu fiables ou hors sujet)
sources_exclues: [Facebook, YouTube, Instagram, TikTok, X, World Socialist Web Site, Vietnam.vn, Sputnik, RT]
synthese_hebdo: lundi   # jour de la synthèse de la semaine (ou « non »)

# Modèle IA (Google Gemini, offre gratuite). Les suivants servent de secours.
modeles:
  - gemini-flash-latest
  - gemini-3.6-flash
  - gemini-3.5-flash-lite

# ── Rubriques du brief (dans l'ordre d'affichage) ───────────
# max       : nombre maximum de sujets dans la rubrique
# consigne  : ce que l'IA doit y mettre
# mots_cles : utilisés seulement si l'IA est indisponible (classement simple)
rubriques:
  - id: defense_aerienne
    titre: Défense aérienne & antimissile
    max: 4
    consigne: >
      Défense aérienne et antimissile (IAMD, sol-air, GBAD), radars, C2, lutte anti-drones (C-UAS),
      aviation de combat, frappes de missiles ou de drones et leur interception, partout dans le monde.
    mots_cles: [air defense, air defence, missile defense, interceptor, iamd, gbad, patriot, thaad, samp/t,
                c-uas, counter-drone, antimissile, défense aérienne, sol-air, 防空, 방공]

  - id: asie
    titre: Asie-Pacifique
    max: 4
    consigne: >
      Sécurité et géopolitique en Asie-Pacifique (hors Asie du Sud-Est) : Chine, Taïwan, mer de Chine,
      Corées, Japon, Inde, Pakistan, Australie, Pacifique.
    mots_cles: [china, taiwan, korea, japan, india, pakistan, australia, south china sea, pla, chine, taïwan,
                corée, japon, inde, australie]

  - id: singapour
    titre: Singapour & ASEAN
    max: 3
    consigne: >
      Singapour (SAF, RSAF, MINDEF, politique, économie, relations extérieures) et Asie du Sud-Est :
      Malaisie, Indonésie, Philippines, Vietnam, Thaïlande, Myanmar, ASEAN.
    mots_cles: [singapore, singapour, mindef, rsaf, asean, malaysia, indonesia, philippines, vietnam, thailand,
                myanmar, cambodia, malaisie, indonésie, thaïlande]

  - id: industrie
    titre: Industrie & contrats
    max: 3
    consigne: >
      Contrats et programmes d'armement, budgets de défense, exportations, actualité des industriels
      (Airbus, Thales, MBDA, Lockheed Martin, RTX, Hanwha, Rafael, Saab, KAI…), en priorité en Asie.
    mots_cles: [contract, contrat, procurement, acquisition, tender, budget, airbus, thales, mbda, lockheed,
                raytheon, rtx, hanwha, rafael, boeing, saab, defence industry, industrie]

  - id: espace
    titre: Espace & satellites
    max: 2
    consigne: >
      Spatial militaire et dual : satellites d'observation et de télécommunication, alerte avancée,
      lancements, programmes spatiaux nationaux, menaces antisatellites.
    mots_cles: [satellite, space force, launch, orbit, spatial, espace, rocket, fusée]

  - id: tech
    titre: Technologies émergentes
    max: 2
    consigne: >
      Technologies militaires de rupture : hypersonique, IA militaire, essaims de drones, armes à énergie
      dirigée (lasers, micro-ondes), quantique, autonomie.
    mots_cles: [hypersonic, hypersonique, laser, directed energy, drone swarm, essaim, artificial intelligence,
                quantum, quantique, autonomous]

  - id: cyber
    titre: Cyber & guerre électronique
    max: 2
    consigne: >
      Cyberattaques étatiques, espionnage numérique, guerre électronique, brouillage GPS / GNSS.
    mots_cles: [cyber, hacker, ransomware, electronic warfare, jamming, brouillage, spoofing]

  - id: europe
    titre: Europe de la défense
    max: 2
    consigne: >
      UNIQUEMENT la défense et la sécurité européennes : OTAN, armées européennes, budgets et programmes
      (SAMP/T, ESSI, SCAF/FCAS, GCAP…), politique de défense française. La politique intérieure européenne
      (manifestations, émeutes, gouvernements) va dans « monde ».
    mots_cles: [nato, otan, european defence, defense européenne, bundeswehr, ministère des armées, essi]

  - id: ukraine
    titre: Ukraine / Russie
    max: 2
    consigne: >
      Guerre en Ukraine et Russie : front, frappes de missiles et de drones, défense aérienne ukrainienne,
      négociations, sanctions liées.
    mots_cles: [ukraine, russia, russie, kyiv, kiev, moscow, moscou, kremlin, zelensky, putin, poutine]

  - id: moyen_orient
    titre: Moyen-Orient
    max: 2
    consigne: >
      Iran, Israël, Gaza, Liban, Syrie, Golfe, Yémen / Houthis, mer Rouge.
    mots_cles: [iran, israel, israël, gaza, lebanon, liban, syria, syrie, houthi, yemen, yémen, saudi, red sea]

  - id: economie
    titre: Économie & sanctions
    max: 2
    consigne: >
      Contrôles à l'export, sanctions, guerre commerciale, chaînes d'approvisionnement stratégiques
      (semi-conducteurs, terres rares, énergie).
    mots_cles: [sanction, export control, tariff, droits de douane, semiconductor, semi-conducteur, rare earth,
                terres rares, supply chain]

  - id: elections
    titre: Élections & politique
    max: 3
    consigne: >
      Élections, changements de gouvernement et crises politiques majeures dans le monde (Asie en priorité),
      avec dates et résultats quand ils sont connus.
    mots_cles: [election, élection, vote, ballot, referendum, référendum, législatives, présidentielle,
                prime minister, premier ministre, parliament, 선거, 選挙]

  - id: monde
    titre: Monde
    max: 2
    consigne: >
      Autres actualités internationales majeures qui n'entrent dans aucune autre rubrique : politique
      intérieure européenne et américaine, Afrique, Amérique latine, diplomatie mondiale.
    mots_cles: []

